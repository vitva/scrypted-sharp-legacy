name: Build legacy x86-64 Sharp

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VIPS_VERSION: 8.17.3
      SHARP_VERSION: 0.34.5
      CFLAGS: -O2 -march=x86-64 -mtune=generic
      CXXFLAGS: -O2 -march=x86-64 -mtune=generic
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config meson ninja-build \
            libglib2.0-dev libexpat1-dev libjpeg-turbo8-dev libpng-dev \
            libwebp-dev libtiff-dev curl git python3

      - name: Build libvips for baseline x86-64
        run: |
          curl -fsSL "https://github.com/libvips/libvips/releases/download/v${VIPS_VERSION}/vips-${VIPS_VERSION}.tar.xz" -o vips.tar.xz
          tar -xf vips.tar.xz
          cd "vips-${VIPS_VERSION}"
          meson setup build --prefix=/opt/legacy-vips --libdir=lib \
            -Dintrospection=disabled -Dmodules=enabled \
            -Dmagick=disabled -Dheif=disabled -Djpeg-xl=disabled \
            -Dhighway=disabled -Dorc=disabled \
            -Dexif=disabled -Dopenexr=disabled -Darchive=disabled
          meson compile -C build
          sudo meson install -C build
          echo "/opt/legacy-vips/lib" | sudo tee /etc/ld.so.conf.d/legacy-vips.conf
          sudo ldconfig
          /opt/legacy-vips/bin/vips --version
          PKG_CONFIG_PATH=/opt/legacy-vips/lib/pkgconfig pkg-config --modversion vips-cpp

      - name: Build Sharp from source against custom libvips
        env:
          SHARP_FORCE_GLOBAL_LIBVIPS: "1"
          PKG_CONFIG_PATH: /opt/legacy-vips/lib/pkgconfig
        run: |
          mkdir sharp-test
          cd sharp-test
          npm init -y
          npm install --save node-addon-api node-gyp
          npm install "sharp@${SHARP_VERSION}"
          npm explore sharp -- npm run build
          node -e "const sharp=require('sharp'); console.log(sharp.versions); sharp({create:{width:8,height:8,channels:3,background:'#336699'}}).jpeg().toBuffer().then(b=>console.log('JPEG smoke test OK:',b.length,'bytes'))"

      - name: Verify runtime shared-library dependencies
        run: |
          set -o pipefail
          ldd /opt/legacy-vips/lib/libvips.so.42 | tee libvips-ldd.txt
          ! grep -q "not found" libvips-ldd.txt
          ldd sharp-test/node_modules/sharp/src/build/Release/sharp-linux-x64.node | tee sharp-ldd.txt
          ! grep -q "not found" sharp-ldd.txt

      - name: Package build artifacts
        run: |
          mkdir -p artifact/lib artifact/sharp
          cp -a /opt/legacy-vips/lib/. artifact/lib/
          cp -a sharp-test/node_modules/sharp artifact/sharp/
          tar -czf sharp-legacy-x86_64.tar.gz -C artifact .
          sha256sum sharp-legacy-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: sharp-legacy-x86_64
          path: sharp-legacy-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Scrypted Sharp Legacy ${{ github.ref_name }}
          body: |
            Baseline x86-64 build of Sharp ${{ env.SHARP_VERSION }} with libvips ${{ env.VIPS_VERSION }}.

            Built for older x86-64 CPUs without AVX support. Tested on AMD G-T56N (Bobcat).

            This is an unofficial compatibility build, not an official Sharp, libvips, or Scrypted release.
          files: sharp-legacy-x86_64.tar.gz
          fail_on_unmatched_files: true
          make_latest: true
